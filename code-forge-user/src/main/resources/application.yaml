spring:
  application:
    name: code-forge-user
  # 服务注册
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 123456
  # 数据库配置（todo 按本机实际情况替换）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/myoj
    username: root
    password: 123456
  # Sa-Token 用 Redis 中心化存储登录态（必须，否则默认内存→分布式失效）
  data:
    redis:
      host: 127.0.0.1            # 实测可通（WSL 镜像网络，Windows 侧直连即可）
      port: 6379
      database: 0

server:
  address: 0.0.0.0
  port: 8102
  servlet:
    context-path: /api/user

mybatis-plus:
  # 原生 SQL 抽到 src/main/resources/mapper/*.xml；注解方式仍照常用，两者互补。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # true：DB 列 snake_case（user_id）自动映射到 Java 字段驼峰（userId）。
    # Java 侧字段名 / VO / DTO / 前端 JSON 保持驼峰不变。
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# ===== Sa-Token 登录态 =====
# 登录态载体是 Redis 中的 token（中心化），天然跨服务 / 跨实例。
# 详见 docs/改造方案-SaToken-Redis.md。
sa-token:
  token-name: satoken            # 前端 cookie/header 的 token 键名
  timeout: 2592000               # token 有效期 30 天
  active-timeout: -1             # 不限活跃续期
  is-concurrent: true            # 同端多设备登录互斥关闭（本地调试可开）
  is-share: true                 # 同账号多端共享 token
  token-style: uuid
  is-read-cookie: true           # 从 cookie 读 token（前端 Vite proxy 同源自动带）
  is-read-header: true           # 也支持 header: satoken=xxx
  is-write-cookie: true          # 登录后框架自动写 satoken cookie 回浏览器
  cookie:
    domain: ""                   # 留空=跟随当前 host
    samesite: Lax                # 同源 proxy 下 Lax 足够
