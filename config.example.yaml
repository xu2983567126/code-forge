# ============================================================
# 系统运行配置（示例 / 查阅用）
# 说明：本文件为配置参考模板，明文占位，仅用于本地开发与本机查阅。
#      生产环境请勿提交真实密码，应改为环境变量注入或密文存储。
# ============================================================

# ---------- 服务端口 ----------
# 本服务对外暴露的 HTTP 端口。
# 注意：本仓库各微服务端口已在各自 application.yaml 中固定（见下），
#       此处 general.port 为「单一服务 / 独立部署」场景的统一个端口占位。
server:
  port: 8100                 # 服务端口（占位，按实际部署调整）

# 附：本仓库已固定的微服务端口（查阅参考，勿在代码中重复定义）
#   gateway        : 8101
#   user-service    : 8102
#   question-service: 8103
#   submission-service: 8104
#   judge-service   : 8105

# ---------- 管理员账号 ----------
# 首次启动用于灌库 / 登录后台的管理员凭据（明文占位）。
admin:
  username: admin            # 管理员账号（占位）
  password: admin123         # 管理员密码（占位，生产必须替换）
  # role: ADMIN             # 可选：管理员角色标识
  # enabled: true           # 可选：账号是否启用

# ---------- 生产环境安全提示（查阅） ----------
# 1. 明文密码仅限本地开发；上线前改为以下任一方式：
#      - 环境变量注入：admin.password: ${ADMIN_PASSWORD}
#      - 密文存储：password 字段存 BCrypt 哈希，校验时比对
# 2. 端口避免与宿主 SERVER__PORT 等注入变量冲突（本机启动前需 unset）。
# 3. 本文件若含真实凭据，请勿提交进版本库。
